app = "aambal-nayam"
primary_region = "sin"

[build]

[env]
  PORT = "3000"
  TEA_SHOP_DB_PATH = "/data/tea_shop.db"

[[mounts]]
  source = "tea_shop_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
