services:
  - type: web
    name: aambal-nayam
    runtime: node
    plan: starter
    region: singapore
    buildCommand: rm -rf node_modules && npm install --include=dev && npm run build
    startCommand: npm run seed && npm start
    disk:
      name: tea-shop-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: TEA_SHOP_DB_PATH
        value: /var/data/tea_shop.db
